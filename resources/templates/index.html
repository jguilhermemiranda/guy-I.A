<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo"><div class="logo-icon"><img src="/static/img/guy.png" alt="Guy"></div><span>Guy</span></div>
            <button class="new-chat" id="new-chat" type="button">＋ Nova conversa</button>
            <button class="sidebar-button debate-link" type="button" onclick="window.location.href='/debate'">⚔️ Debate estruturado</button>
            <p class="sidebar-section">CONVERSA ATUAL</p>
            <div class="conversations"><div class="conversation active"><span>💬</span><span id="conversation-title">Nova conversa</span></div></div>
            <div class="sidebar-bottom">
                <button class="sidebar-button" id="add-knowledge" type="button">📚 Base de conhecimento</button>
                <input id="knowledge-file" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown" hidden>
                <button class="sidebar-button" type="button" onclick="window.location.href='/memorias'">🧠 Memórias</button>
                <button class="sidebar-button" type="button" onclick="window.location.href='/perfil'">⚙️ Perfil e preferências</button>
            </div>
        </aside>

        <main class="chat">
            <header class="topbar">
                <div class="agent-selector" id="agent-selector">
                    <button class="agent-selector-button guy" id="agent-selector-button" type="button" aria-haspopup="true" aria-expanded="false">
                        <img id="agent-avatar" src="/static/img/guy.png" alt="Guy">
                        <span><strong id="agent-name">Guy</strong><small id="agent-description">Agente principal</small></span>
                        <span class="agent-arrow">⌄</span>
                    </button>
                    <div class="agent-menu" id="agent-menu" role="menu">
                        <button class="agent-option active guy" data-agent="guy" type="button"><img src="/static/img/guy.png" alt=""><span><strong>Guy</strong><small>Agente principal</small></span><b>✓</b></button>
                        <button class="agent-option fearth" data-agent="fearth" type="button"><img src="/static/img/guy%20(2).png" alt=""><span><strong>Fearth</strong><small>Agente independente</small></span><b>✓</b></button>
                        <button class="agent-option debate" data-agent="debate" type="button"><span class="mode-icon">⚔️</span><span><strong>Debate estruturado</strong><small>Sessão com rodadas</small></span><b>↗</b></button>
                    </div>
                </div>
                <button class="context-toggle" id="context-toggle" type="button"
                    aria-pressed="true" aria-describedby="context-description" disabled>
                    <span class="context-toggle-icon" id="context-toggle-icon" aria-hidden="true">◉</span>
                    <span class="context-toggle-copy">
                        <strong class="context-toggle-label" id="context-toggle-label">Contexto ON</strong>
                        <small id="context-description">Inclui trechos relevantes da conversa</small>
                    </span>
                </button>
                <span class="status"><i></i> Online</span>
            </header>
            <p class="context-status" id="context-status" role="status" aria-live="polite"></p>

            <section class="messages" id="messages" aria-live="polite">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon" id="welcome-icon"><img id="welcome-avatar" src="/static/img/guy.png" alt="Guy"></div>
                    <h1 id="welcome-title">Fala, Guy aqui. 👋</h1>
                    <p id="welcome-text">Manda a pergunta, projeto ou problema.<br>Vamos descobrir juntos.</p>
                </div>
            </section>

            <div class="input-area">
                <div class="temperature-row">
                    <label class="temperature-control" for="temperature-slider">
                        <span>Criatividade</span>
                        <input id="temperature-slider" type="range" min="0" max="1" step="0.05" value="0.20">
                        <output id="temperature-value" for="temperature-slider">0.20</output>
                    </label>
                </div>
                <div class="input-box"><textarea id="message" rows="1" placeholder="Digite sua mensagem..."></textarea><button id="voice-input" type="button" aria-label="Falar uma mensagem" title="Falar uma mensagem">🎙</button><button id="send" type="button" aria-label="Enviar mensagem">➤</button></div>
                <p class="voice-status" id="voice-status" role="status"></p>
                <p class="disclaimer">Guy e Fearth podem cometer erros. Confira informações importantes.</p>
            </div>
        </main>
    </div>
    <div class="modal hidden" id="knowledge-dialog" role="dialog" aria-modal="true" aria-labelledby="knowledge-title">
        <div class="modal-overlay" data-close-knowledge></div>
        <section class="modal-box knowledge-modal">
            <header class="modal-header">
                <div>
                    <h2 id="knowledge-title">Base de conhecimento</h2>
                    <p>Adicione ou remova arquivos usados pelo Guy.</p>
                </div>
                <button class="modal-close" id="knowledge-close" type="button" aria-label="Fechar">×</button>
            </header>
            <button class="button-primary knowledge-add-button" id="knowledge-add-file" type="button">＋ Adicionar arquivo</button>
            <p class="knowledge-status" id="knowledge-status" role="status" aria-live="polite"></p>
            <div class="knowledge-files" id="knowledge-files" aria-live="polite"></div>
        </section>
    </div>
    <script src="{{ url_for('static', filename='audio.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
